name: Build

on:
  push:
    branches: [main]
    tags: ['v*']   # uma tag vX.Y.Z publica uma release => o Studio oferece a atualização
  pull_request:
  workflow_dispatch:

jobs:
  core-tests:
    name: Testes do núcleo (Linux, ASan/UBSan)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Configurar
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DVTHOST_BUILD_STUDIO=OFF
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
      - name: Compilar
        run: cmake --build build --parallel
      - name: Testar
        run: ctest --test-dir build --output-on-failure
      - name: Traduções PT completas
        run: python3 scripts/translations.py --check

  windows:
    name: Windows (motor, watchdog, Studio)
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: 'win64_msvc2022_64'
          cache: true

      - name: Cache FFmpeg
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: third_party/ffmpeg
          key: ffmpeg-${{ hashFiles('scripts/fetch-deps.ps1') }}-v1

      - name: Descarregar FFmpeg
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./scripts/fetch-deps.ps1

      - name: Configurar
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Compilar
        run: cmake --build build --config Release --parallel

      - name: Testar
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Empacotar
        shell: pwsh
        run: |
          $out = "dist/VTHOST"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item build/bin/*.exe $out
          Copy-Item build/bin/*.dll $out
          Remove-Item "$out/vthost_core_tests.exe" -ErrorAction SilentlyContinue
          windeployqt --release --no-compiler-runtime "$out/vthost-studio.exe"
          # Runtime do Visual C++ junto dos executáveis (não é preciso instalar o VC++ Redistributable).
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $crtDir = & $vswhere -latest -products * -find "VC\Redist\MSVC\*\x64\Microsoft.VC14*.CRT\vcruntime140.dll" |
              ForEach-Object { Split-Path $_ } | Sort-Object | Select-Object -Last 1
          if (-not $crtDir) { throw "Runtime do Visual C++ não encontrado" }
          Write-Host "CRT: $crtDir"
          Copy-Item "$crtDir\*.dll" $out
          Copy-Item README.md $out
          New-Item -ItemType Directory -Force -Path dist/symbols | Out-Null
          Copy-Item build/bin/*.pdb dist/symbols -ErrorAction SilentlyContinue

      - name: Versão
        id: version
        shell: pwsh
        run: |
          $m = Select-String -Path CMakeLists.txt -Pattern 'VERSION (\d+\.\d+\.\d+)' | Select-Object -First 1
          $v = $m.Matches[0].Groups[1].Value
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$v") {
            throw "A tag $env:GITHUB_REF_NAME não corresponde à versão do CMakeLists.txt ($v)"
          }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Criar instalador
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          $v = "${{ steps.version.outputs.version }}"
          & $iscc "/DAppVersion=$v" "/DSourceDir=$PWD\dist\VTHOST" "/DOutputDir=$PWD\dist\installer" installer\vthost.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC falhou" }
          $exe = "dist/installer/VTHOST-Setup-$v.exe"
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          "$hash  VTHOST-Setup-$v.exe" | Out-File -Encoding ascii -NoNewline "$exe.sha256"

      - name: Publicar build
        uses: actions/upload-artifact@v4
        with:
          name: VTHOST-windows-x64
          path: dist/VTHOST

      - name: Publicar instalador
        uses: actions/upload-artifact@v4
        with:
          name: VTHOST-Setup
          path: dist/installer

      - name: Criar release (só em tags vX.Y.Z)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: VTHOST ${{ steps.version.outputs.version }}
          files: |
            dist/installer/VTHOST-Setup-*.exe
            dist/installer/VTHOST-Setup-*.exe.sha256
          generate_release_notes: true

      - name: Publicar símbolos (para analisar crashes)
        uses: actions/upload-artifact@v4
        with:
          name: VTHOST-symbols
          path: dist/symbols
