name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  core-tests:
    name: Testes do núcleo (Linux, ASan/UBSan)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Configurar
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DVTHOST_BUILD_STUDIO=OFF
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
      - name: Compilar
        run: cmake --build build --parallel
      - name: Testar
        run: ctest --test-dir build --output-on-failure

  windows:
    name: Windows (motor, watchdog, Studio)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: 'win64_msvc2022_64'
          cache: true

      - name: Cache FFmpeg
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: third_party/ffmpeg
          key: ffmpeg-${{ hashFiles('scripts/fetch-deps.ps1') }}-v1

      - name: Descarregar FFmpeg
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./scripts/fetch-deps.ps1

      - name: Configurar
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Compilar
        run: cmake --build build --config Release --parallel

      - name: Testar
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Empacotar
        shell: pwsh
        run: |
          $out = "dist/VTHOST"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item build/bin/*.exe $out
          Copy-Item build/bin/*.dll $out
          Remove-Item "$out/vthost_core_tests.exe" -ErrorAction SilentlyContinue
          windeployqt --release "$out/vthost-studio.exe"
          Copy-Item README.md $out
          New-Item -ItemType Directory -Force -Path dist/symbols | Out-Null
          Copy-Item build/bin/*.pdb dist/symbols -ErrorAction SilentlyContinue

      - name: Publicar build
        uses: actions/upload-artifact@v4
        with:
          name: VTHOST-windows-x64
          path: dist/VTHOST

      - name: Publicar símbolos (para analisar crashes)
        uses: actions/upload-artifact@v4
        with:
          name: VTHOST-symbols
          path: dist/symbols
